<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Link ungültig – UrbanInspire</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ede9fe 0%, #e0f2fe 100%);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(79, 70, 229, 0.12);
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.5px;
      margin-bottom: 40px;
    }
    .brand span { color: #4f46e5; }

    .icon-circle {
      width: 80px;
      height: 80px;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    .icon-circle svg {
      width: 40px;
      height: 40px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 14px;
    }

    p {
      font-size: 15px;
      line-height: 1.65;
      color: #64748b;
      margin-bottom: 36px;
    }

    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Urban<span>Inspire</span></div>

    <div class="icon-circle">
      <!-- X icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>

    <h1>Link ungültig</h1>
    <p>
      Dieser Aktivierungslink ist ungültig oder wurde bereits verwendet.<br/>
      Bitte registriere dich erneut oder wende dich an den Support.
    </p>

    <div class="footer">&copy; 2026 UrbanInspire</div>
  </div>
</body>
</html>
